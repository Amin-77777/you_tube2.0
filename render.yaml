services:
  # Backend API & WebSocket Service (Express + Socket.io + Mongoose)
  - type: web
    name: youtube-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DB_URL
        sync: false
      - key: PORT
        value: 5000
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: OTP_MAX_ATTEMPTS
        value: 5
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: 60
      - key: TRUSTED_DEVICE_DURATION_DAYS
        value: 30
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: IP_GEOLOCATION_API_KEY
        sync: false
      - key: SMS_PROVIDER_API_KEY
        sync: false

  # Frontend Web Service (Next.js)
  - type: web
    name: youtube-frontend
    runtime: node
    plan: free
    rootDir: yourtube
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: youtube-backend
          property: host
